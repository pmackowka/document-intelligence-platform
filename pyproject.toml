[project]
name = "document-intelligence-platform"
version = "0.1.0"
description = "Lokalna platforma do przetwarzania dokumentacji medycznej z analizą trendów (V1)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "docling>=2.113.0",
    "ocrmac>=1.0.1",
    "pl-core-news-lg",
    "presidio-analyzer>=2.2.363",
    "presidio-anonymizer>=2.2.363",
    "pyyaml>=6.0.3",
    "spacy>=3.8.13",
]

[tool.uv.sources]
pl-core-news-lg = { url = "https://github.com/explosion/spacy-models/releases/download/pl_core_news_lg-3.8.0/pl_core_news_lg-3.8.0-py3-none-any.whl" }
