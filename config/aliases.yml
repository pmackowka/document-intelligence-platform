# Warstwa 1 — mapowanie nazw markerów -> nazwa kanoniczna, SCOPED PER PANEL.
#
# Dlaczego panele: ten sam napis znaczy różne rzeczy zależnie od badania.
#   "Leukocyty" w morfologii = WBC (krew); "Leukocyty" w moczu = leukocyty moczu.
#   "Barwa" w moczu = urine_color; "Barwa" w kale = stool_color.
#   "Glukoza" w moczu (tabela) = urine_glucose; "Glukoza" w biochemii (sekcja) = glucose.
#
# Panel wykrywany z nagłówka sekcji po kodzie ICD-9 (np. "ICD-9: C55" -> morfologia).
#
# DWA FORMATY dokumentów (pole `format`):
#   table   — wyniki w tabeli markdown (|...|); parsowanie POZYCYJNE (nazwa|wynik|jedn|MIN|MAX).
#   section — wyniki luźne: nazwa markera (często z inline "(ICD-9: kod)") a wartość/jednostka/
#             /zakres rozrzucone w kolejnych liniach (lipidogram, biochemia, serologia).
#             Markery `section` rozpoznawane po NAZWIE (nie po kodzie ICD, bo bywa popsuty:
#             "-", "055"); ich kod ICD jest per-marker, nie per-panel.
#
# Klucz markera znormalizowany: lowercase, bez polskich diakrytyków, bez gwiazdek
# (patrz norm() w src/structural_pipeline.py) — dzięki temu "Płytki"/"Plytki" (błąd OCR)
# trafiają w ten sam klucz.
#
# Pipeline czyta WYŁĄCZNIE ten (zatwierdzony) słownik. Nieznane nazwy -> Warstwa 3
# proponuje wpis do data/pending/aliases.yml; operator zatwierdza, przenosząc tutaj.

panels:
  morfologia:
    format: table
    icd9: ["C55"]
    markers:
      "leukocyty": "WBC"
      "erytrocyty": "RBC"
      "hemoglobina": "HGB"
      "hematokryt": "HCT"
      "mcv": "MCV"
      "mch": "MCH"
      "mchc": "MCHC"
      "rdw-cv": "RDW_CV"
      "rdw-sd": "RDW_SD"
      "plytki krwi": "PLT"
      "pdw": "PDW"
      "mpv": "MPV"
      "p-lcr": "P_LCR"
      "neutrofile": "NEU"
      "limfocyty": "LYM"
      "monocyty": "MONO"
      "eozynofile": "EOS"
      "bazofile": "BASO"
      "niedojrzale granulocyty ig": "IG"
      "nrbc": "NRBC"
      "krwinki biale (wbc)": "WBC"
      "krwinki czerwone (rbc)": "RBC"
      "pct": "PCT"
      "% neutrocytow": "NEU"
      "liczba neutrocytow": "NEU"
      "% limfocytow": "LYM"
      "liczba limfocytow": "LYM"
      "% monocytow": "MONO"
      "liczba monocytow": "MONO"
      "% eozynocytow": "EOS"
      "liczba eozynocytow": "EOS"
      "% bazocytow": "BASO"
      "liczba bazocytow": "BASO"
      "liczba niedojrzalych granulocytow (ig)": "IG"
      "% niedojrzalych granulocytow (ig)": "IG"
      "% nrbc": "NRBC"

  mocz:
    format: table
    icd9: ["A01"]
    markers:
      "przejrzystosc": "urine_clarity"
      "barwa": "urine_color"
      "ciezar wlasciwy": "urine_specific_gravity"
      "ph": "urine_ph"
      "glukoza": "urine_glucose"
      "ketony": "urine_ketones"
      "urobilinogen": "urine_urobilinogen"
      "bilirubina": "urine_bilirubin"
      "bialko": "urine_protein"
      "leukocyty": "urine_leukocytes"
      "krew": "urine_blood"
      "azotyny": "urine_nitrites"

  koprogram:
    format: table
    icd9: ["A23"]
    markers:
      "barwa": "stool_color"
      "konsystencja": "stool_consistency"
      "won": "stool_odor"
      "odczyn": "stool_ph"
      "wlokna miesne dobrze strawione liczne": "stool_muscle_fibers_digested"
      "wlokna miesne zle strawione": "stool_muscle_fibers_undigested"
      "krople tluszczu liczne krysztaly kw. t.": "stool_fat_droplets"
      "ziarna skrobi": "stool_starch_granules"

  biochemia:
    format: section
    icd9: []          # kod ICD jest per-marker (I17, I19, N13...); rozpoznanie po nazwie
    markers:
      "ob": "ESR"
      "glukoza": "glucose"
      "alt": "ALT"
      "ast": "AST"
      "mocznik": "urea"
      "kreatynina": "creatinine"
      "egfr": "eGFR"
      "kwas moczowy": "uric_acid"
      "aptt (czas kaolinowo-kefalinowy)": "APTT"
      "pt (inr, quick)": "PT"
      "pt": "PT"
      "wskaznik pt": "PT"
      "inr": "INR"
      "sod": "Na"
      "potas": "K"
      "wapn calkowity": "Ca"
      "wapn": "Ca"
      "fosfataza zasadowa": "ALP"
      "witamina d metabolit 25(oh)": "VIT_D_25OH"
      "globulina wiazaca hormony plciowe (shbg) (183)": "SHBG"
      "[n45] potas": "K"
      "[n13] mocznik": "urea"
      "[l23] fosforany": "PHOS"
      "[077] wapn": "Ca"
      "[m87] magnez": "Mg"
      "[o77] wapn w moczu": "urine_calcium"
      "[l23] fosforany w moczu": "urine_phosphate"
      "[m45] kwas moczowy w moczu": "urine_uric_acid"
      "[m87] magnez w moczu": "urine_magnesium"
      "[n13] mocznik w moczu": "urine_urea"
      "[n45] potas w moczu": "urine_potassium"
      "[o35] stezenie sodu": "urine_sodium"
      "fosfor nieorganiczny": "PHOS"
      "magnez": "Mg"
      "wapni w dzm": "urine_calcium_24h"
      "ggtp": "GGT"
      "crp": "CRP"

  lipidy:
    format: section
    icd9: ["M71"]     # nagłówek "Lipidogram (ICD-9: M71)" wprowadza markery-dzieci
    markers:
      "cholesterol calkowity": "CHOL"
      "cholesterol hdl": "HDL"
      "cholesterol nie-hdl": "nonHDL"
      "cholesterol ldl": "LDL"
      "triglicerydy": "TG"

  tarczyca:
    format: section
    icd9: []          # TSH/FT3/FT4 jako markery inline, kod per-marker (L69, O55, O69)
    markers:
      "tsh": "TSH"
      "[l69] tsh": "TSH"
      "plc przeciw peroksydazie tarczycowej (atpo) (009)": "ATPO"
      "ft3": "FT3"
      "ft4": "FT4"

  psa:
    format: section
    icd9: []          # PSA jako marker inline / dzieci nagłówka "PSA wskaźnik (ICD-9: -)"
    markers:
      "psa": "PSA"
      "psa calkowity": "PSA"
      "psa wolny": "PSA_free"
      "psa - wskaznik (fpsa/psa)": "PSA_ratio"
      "psa wskaznik (fpsa/psa)": "PSA_ratio"

  serologia_hcv:
    format: section
    icd9: ["V48"]
    markers:
      "przeciwciala anty-hcv": "anti_HCV"

  serologia_hbv:
    format: section
    icd9: ["V39"]
    markers:
      "antygen hbs": "HBsAg"

  krew_utajona:
    format: section
    icd9: ["A17"]
    markers:
      "krew utajona w kale": "FOB"
