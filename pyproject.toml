[project]
name = "document-intelligence-platform"
version = "0.1.0"
description = "Lokalna platforma do przetwarzania dokumentacji medycznej z analizą trendów (V1)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.128",
    "docling>=2.113.0",
    "mcp[cli]>=1.28.1",
    "ocrmac>=1.0.1",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
